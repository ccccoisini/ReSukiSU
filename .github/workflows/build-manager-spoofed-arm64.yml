name: Build Spoofed Manager ARM64 Release

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-manager-spoofed-arm64.yml'

permissions:
  contents: read

jobs:
  build-lkm:
    uses: ./.github/workflows/build-lkm.yml
    secrets: inherit

  build-ksuinit:
    uses: ./.github/workflows/ksuinit.yml

  build-ksud:
    needs: [build-lkm, build-ksuinit]
    uses: ./.github/workflows/ksud.yml
    with:
      target: aarch64-linux-android
      os: ubuntu-latest

  build-manager:
    name: build-manager (spoofed, release)
    needs: build-ksud
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager
    env:
      SIGN_KEYSTORE: ${{ secrets.KEYSTORE }}
      SIGN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      SIGN_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      SIGN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Run randomizer
        run: |
          chmod +x randomizer
          ./randomizer

      - name: Fix spoofed app identity and version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/build.gradle.kts")
          text = path.read_text()
          app_id = 'applicationId = "com.games.lucky"'
          # Preserve the namespace generated by randomizer for Kotlin and R imports.
          if re.search(r'applicationId\s*=\s*["\'][^"\']+["\']', text):
              text = re.sub(r'applicationId\s*=\s*["\'][^"\']+["\']', app_id, text, count=1)
          else:
              text = re.sub(r'(defaultConfig\s*\{)', r'\1\n        ' + app_id, text, count=1)
          if app_id not in text:
              raise SystemExit("Failed to set spoofed applicationId")
          path.write_text(text)

          for path in Path("app/src/main/res").glob("**/strings.xml"):
              text = re.sub(
                  r'(<string\s+name=["\']app_name["\'][^>]*>)(.*?)(</string>)',
                  r'\1Lucky\3',
                  path.read_text(),
                  flags=re.DOTALL,
              )
              path.write_text(text)

          path = Path("build.gradle.kts")
          text = path.read_text()
          text = text.replace('.trim() + "-spoofed"', '.trim()')
          text = text.replace(".trim() + '-spoofed'", ".trim()")
          path.write_text(text)
          PY

      - name: Prepare signing inputs
        run: |
          test -n "$SIGN_KEYSTORE"
          test -n "$SIGN_KEY_ALIAS"
          test -n "$SIGN_KEYSTORE_PASSWORD"
          test -n "$SIGN_KEY_PASSWORD"
          printf '%s' "$SIGN_KEYSTORE" | base64 -d > key.jks
          {
            printf 'KEYSTORE_FILE=key.jks\n'
            printf 'KEY_ALIAS=%s\n' "$SIGN_KEY_ALIAS"
            printf 'KEYSTORE_PASSWORD=%s\n' "$SIGN_KEYSTORE_PASSWORD"
            printf 'KEY_PASSWORD=%s\n' "$SIGN_KEY_PASSWORD"
          } >> gradle.properties

      - name: Build spoofed ARM64 release APK
        run: ./gradlew assembleRelease -PmanagerAbis=arm64-v8a -Pcommit="$GITHUB_SHA"

      - name: Download ARM64 ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-aarch64-linux-android
          path: artifacts/ksud-arm64

      - name: Place ARM64 ksud
        working-directory: .
        run: |
          ARM64_KSUD=$(find artifacts/ksud-arm64 -type f -name ksud | head -n 1)
          test -n "$ARM64_KSUD"
          mkdir -p target/aarch64-linux-android/release
          cp -f "$ARM64_KSUD" target/aarch64-linux-android/release/ksud

      - name: Test APK repacking
        working-directory: .
        run: python3 -m unittest discover -s scripts -p test_repack_apk_multi.py -v

      - name: Repack and sign ARM64 APK
        working-directory: .
        run: |
          python3 repack_apk_multi.py repack \
            -b release \
            -t release \
            -a arm64-v8a \
            -K manager/key.jks \
            -A "$SIGN_KEY_ALIAS" \
            -P "$SIGN_KEYSTORE_PASSWORD" \
            -S "$SIGN_KEY_PASSWORD" \
            --strip

      - name: Verify ARM64 APK and signature
        working-directory: .
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import repack_apk

          apks = sorted(Path("dist").glob("*.apk"))
          if len(apks) != 1:
              raise SystemExit(f"Expected one ARM64 APK, found {len(apks)}")
          apk = apks[0]
          with ZipFile(apk) as archive:
              arches = {name.split("/")[1] for name in archive.namelist() if name.startswith("lib/")}
              if arches != {"arm64-v8a"}:
                  raise SystemExit(f"Unexpected APK architectures: {sorted(arches)}")
              library = "lib/arm64-v8a/libksud.so"
              if library not in archive.namelist():
                  raise SystemExit(f"Missing {library}")
              header = archive.read(library)[:20]
              if header[:5] != b"\x7fELF\x02" or int.from_bytes(header[18:20], "little") != 183:
                  raise SystemExit("Packaged ksud is not an ARM64 ELF")

          apksigner = repack_apk.find_android_tool("apksigner")
          zipalign = repack_apk.find_android_tool("zipalign")
          if apksigner is None or zipalign is None:
              raise SystemExit("Android APK verification tools not found")
          repack_apk.run_cmd([str(apksigner), "verify", str(apk)], "APK signature verification failed")
          repack_apk.run_cmd([str(zipalign), "-c", "-P", "16", "4", str(apk)], "APK alignment verification failed")
          print(f"Verified signed ARM64 APK: {apk.name}")
          PY

      - name: Upload spoofed ARM64 release APK
        uses: actions/upload-artifact@v7
        with:
          name: Spoofed-Manager-arm64-v8a-release
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload mappings
        uses: actions/upload-artifact@v7
        with:
          name: Spoofed-Manager-arm64-v8a-mappings
          path: manager/app/build/outputs/mapping/release/
          if-no-files-found: ignore
